<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="48" height="48" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
  
  <!-- Wireless Waves -->
  <path d="M12 20C15.2 16.8 20.4 15 24 15C27.6 15 32.8 16.8 36 20" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M16 24C18.4 21.6 21.2 20.5 24 20.5C26.8 20.5 29.6 21.6 32 24" stroke="url(#glowGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  <path d="M20 28C21.2 26.8 22.6 26 24 26C25.4 26 26.8 26.8 28 28" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Hub / Transceiver -->
  <circle cx="24" cy="33" r="3.5" fill="url(#glowGrad)" />
  <circle cx="24" cy="33" r="6" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" opacity="0.7" />

  <!-- Distributed Client Nodes -->
  <circle cx="9" cy="11" r="2.5" fill="#10b981" />
  <circle cx="39" cy="11" r="2.5" fill="#06b6d4" />
  <circle cx="24" cy="7" r="2.5" fill="#6366f1" />

  <!-- Connection rays -->
  <line x1="24" y1="9.5" x2="24" y2="15" stroke="#6366f1" stroke-width="1" stroke-dasharray="1.5 1.5" opacity="0.5" />
  <line x1="11" y1="12.5" x2="15" y2="18" stroke="#10b981" stroke-width="1" stroke-dasharray="1.5 1.5" opacity="0.5" />
  <line x1="37" y1="12.5" x2="33" y2="18" stroke="#06b6d4" stroke-width="1" stroke-dasharray="1.5 1.5" opacity="0.5" />
</svg>
